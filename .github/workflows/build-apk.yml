name: Build GameScout APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: gamescout-apk-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameScout-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Publish APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          apk="GameScout-$version.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" "$apk" --clobber
          else
            gh release create "v$version" "$apk" \
              --title "GameScout $version" \
              --target "$GITHUB_SHA" \
              --latest \
              --notes "Download $apk below and open it on your phone to install. Built from commit ${GITHUB_SHA:0:7}."
          fi
